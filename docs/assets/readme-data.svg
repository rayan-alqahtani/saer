<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Distribution of the 2,742 historical car advertisements by six Saudi cities">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182e"/><stop offset="1" stop-color="#102d4e"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1479ca"/><stop offset="1" stop-color="#1bd2f3"/></linearGradient>
  </defs>
  <rect width="1000" height="440" rx="20" fill="url(#bg)"/>
  <path d="M 35 34 H 100" stroke="#1ad4fa" stroke-width="5" stroke-linecap="round"/>
  <text x="38" y="79" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#f5faff">SIX CITIES. ONE HISTORICAL SNAPSHOT.</text>
  <text x="38" y="107" font-family="Arial, sans-serif" font-size="15" fill="#93b7d0">Distribution of 2,742 recorded vehicle advertisements</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#cdeaff">
    <text x="38" y="160">Riyadh</text><text x="38" y="206">Al Qurayyat</text><text x="38" y="252">Jeddah</text><text x="38" y="298">Dammam</text><text x="38" y="344">Madinah</text><text x="38" y="390">Najran</text>
  </g>
  <g fill="#183955"><rect x="180" y="138" width="612" height="24" rx="9"/><rect x="180" y="184" width="612" height="24" rx="9"/><rect x="180" y="230" width="612" height="24" rx="9"/><rect x="180" y="276" width="612" height="24" rx="9"/><rect x="180" y="322" width="612" height="24" rx="9"/><rect x="180" y="368" width="612" height="24" rx="9"/></g>
  <g fill="url(#bar)"><rect x="180" y="138" width="612" height="24" rx="9"/><rect x="180" y="184" width="133.7" height="24" rx="9"/><rect x="180" y="230" width="112.8" height="24" rx="9"/><rect x="180" y="276" width="62" height="24" rx="9"/><rect x="180" y="322" width="2.3" height="24" rx="1"/><rect x="180" y="368" width="1.4" height="24" rx="1"/></g>
  <g font-family="Arial, sans-serif" fill="#fff" font-size="17" font-weight="700" text-anchor="end">
    <text x="952" y="158">1,818</text><text x="952" y="204">397</text><text x="952" y="250">335</text><text x="952" y="296">184</text><text x="952" y="342">5</text><text x="952" y="388">3</text>
  </g>
  <text x="794" y="413" fill="#76cde9" font-size="11" font-family="Arial, sans-serif" text-anchor="end">Bars show relative advertisement counts, not current market share</text>
</svg>